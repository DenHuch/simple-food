<!DOCTYPE html>
<html lang="uk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SimpleFood Найшвидший сервіс доставки їжі у вашому місті</title>
	<link rel="stylesheet" href="css/style.min.css">
</head>

<body>
	<div class="wrapper">
		<header class="header">
			<div class="container">
				<div class="header__inner">
					<a class="logo" href="#">
						<img class="logo__svg" src="images/logo.svg" alt="Логотип">
					</a>
					<nav class="menu">
						<ul class="menu__list">
							<li class="menu__item">
								<a class="menu-link active" href="#">Головна</a>
							</li>
							<li class="menu__item">
								<a class="menu-link" href="#">Страви</a>
							</li>
							<li class="menu__item">
								<a class="menu-link" href="#">Контакти</a>
							</li>
						</ul>
						<ul class="actions">
							<li class="actions__item">
								<button class="actions__cta" type="button">
									<svg width="21" height="21">
										<use xlink:href="images/sprite.svg#search"></use>
									</svg>
								</button>
							</li>
							<li class="actions__item">
								<button class="actions__cta" type="button">
									<svg width="21" height="20">
										<use xlink:href="images/sprite.svg#shopping-bag"></use>
									</svg>
								</button>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</header>
